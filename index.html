<style>
  :root{
    --green:#2E5D3A; --green-deep:#23472C; --forest:#0C3125;
    --gold:#DAA75A; --gold-soft:#E8C989;
    --ivory:#F5F1E6; --ivory-warm:#FBF7EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--ivory);
    background-image:radial-gradient(circle at 50% -10%, rgba(46,93,58,.10), transparent 60%);
    font-family:'Lato',system-ui,sans-serif;color:var(--green-deep);min-height:100vh;
    padding:34px 18px 30px;
    padding-top:calc(34px + env(safe-area-inset-top,0px));
    padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:620px;margin:0 auto}

  header{text-align:center;margin-bottom:22px}
  .brand{font-size:11px;letter-spacing:3.4px;text-transform:uppercase;font-weight:900;color:var(--green);opacity:.72}
  h1{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(28px,7.8vw,40px);line-height:1.06;color:var(--forest);margin:7px 0 12px}
  .rule{width:54px;height:1px;background:var(--gold);margin:0 auto 13px;position:relative}
  .rule::before,.rule::after{content:'';position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .rule::before{left:-11px}.rule::after{right:-11px}
  .intro{font-size:14px;line-height:1.6;color:#46604D;max-width:430px;margin:0 auto}

  .card{background:var(--ivory-warm);border:1.5px solid rgba(218,167,90,.55);border-radius:18px;padding:19px 18px}
  label.f{display:block;font-size:12px;letter-spacing:1.6px;text-transform:uppercase;font-weight:900;color:#8A6A1E;margin:14px 0 6px}
  input[type=text],input[type=email],textarea{
    width:100%;padding:12px 13px;font-family:inherit;font-size:15px;color:#14261C;
    background:#fff;border:1px solid #E4DECB;border-radius:11px;outline:none;
  }
  input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(218,167,90,.18)}
  .hint{font-size:12.5px;line-height:1.55;color:#6F7A70;margin-top:7px}
  .err{font-size:13px;color:#A8566A;font-weight:700;margin-top:9px}

  .btn{
    display:block;width:100%;text-align:center;text-decoration:none;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:900;padding:14px 16px;border-radius:12px;
    background:var(--green);color:#fff;border:1.5px solid var(--green-deep);
    box-shadow:0 6px 16px rgba(35,71,44,.26);margin-top:18px;
  }
  .btn:disabled{opacity:.55;box-shadow:none}
  .btn.ghost{background:transparent;color:var(--green);border-color:rgba(46,93,58,.4);box-shadow:none;font-weight:700;font-size:13.5px;padding:11px}

  .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:12.5px;color:#6F7A70}
  .who b{color:var(--forest)}
  .who button{margin-left:auto;background:none;border:none;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--green);text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px;cursor:pointer}

  /* poll rows */
  .poll{
    display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;
    background:linear-gradient(150deg,var(--forest),#1f4a2c 62%);
    border:1.5px solid rgba(218,167,90,.5);border-radius:16px;
    padding:15px 16px;margin-bottom:11px;
  }
  .poll:hover{border-color:var(--gold)}
  .poll.closed{background:transparent;border-style:dashed;border-color:rgba(46,93,58,.3)}
  .tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
  .tag{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;font-weight:900;padding:3px 9px;border-radius:99px}
  .tag.open{background:var(--gold);color:#23472C}
  .tag.shut{background:rgba(46,93,58,.12);color:#46604D}
  .tag.mine{background:rgba(247,244,236,.16);color:var(--gold-soft);border:1px solid rgba(218,167,90,.4)}
  .poll.closed .tag.mine{background:rgba(46,93,58,.08);color:#46604D;border-color:rgba(46,93,58,.25)}
  .q{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:#F7F4EC;line-height:1.3}
  .poll.closed .q{color:var(--forest)}
  .meta{font-size:12.5px;color:rgba(232,201,137,.8);margin-top:5px}
  .poll.closed .meta{color:#6F7A70}

  /* detail */
  .detail .q{color:var(--forest);font-size:22px}
  .details{font-size:14px;line-height:1.6;color:#46604D;margin-top:8px}
  .opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .opt{display:flex;align-items:center;gap:11px;padding:13px 14px;border:1.5px solid #E4DECB;border-radius:12px;background:#fff;font-size:15px;cursor:pointer}
  .opt input{width:19px;height:19px;accent-color:var(--green);flex:none}
  .opt.on{border-color:var(--gold);background:#FBF4E4}

  .bar-row{margin-bottom:13px}
  .bar-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
  .bar-top b{font-weight:700;color:var(--forest)}
  .bar-top span{color:#6F7A70;font-weight:700;white-space:nowrap}
  .bar{height:9px;background:rgba(46,93,58,.12);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:9px;background:var(--green);border-radius:99px}
  .bar i.top{background:var(--gold)}

  .tick{
    width:52px;height:52px;margin:2px auto 12px;border-radius:50%;
    background:var(--green);color:#fff;font-size:26px;line-height:52px;font-weight:900;
  }
  .thanks-t{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--forest);margin-bottom:9px}
  .picked{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:13px 0 4px}
  .picked span{font-size:14px;font-weight:700;color:#23472C;background:#FBF4E4;border:1.5px solid var(--gold);border-radius:99px;padding:7px 14px}

  .suggest-cta{text-align:center;margin-top:20px;padding-top:18px;border-top:1px solid rgba(218,167,90,.45)}
  .suggest-b{font-family:'Playfair Display',serif;font-size:16px;color:var(--forest)}
  select{width:100%;padding:12px 13px;font-family:inherit;font-size:15px;color:#14261C;background:#fff;border:1px solid #E4DECB;border-radius:11px;outline:none}
  select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(218,167,90,.18)}

  .join{background:#FBF4E4;border:1.5px solid var(--gold);border-radius:16px;padding:16px 16px 17px;margin-bottom:16px}
  .join-t{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--forest);margin-bottom:5px}
  .join-b{font-size:13.5px;line-height:1.6;color:#5B6B60}
  .join .btn{margin-top:12px}

  .state{text-align:center;padding:28px 18px;border-radius:16px;background:var(--ivory-warm);border:1px dashed rgba(218,167,90,.6);font-size:14px;line-height:1.6;color:#5B6B60}
  .state b{display:block;font-family:'Playfair Display',serif;font-size:18px;color:var(--forest);margin-bottom:5px}

  footer{margin-top:24px;text-align:center}
  .signoff{margin-top:14px;font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:var(--green)}
  .sec{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
  .sec-label{font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;font-weight:900;color:#8A6A1E;white-space:nowrap}
  .sec-rule{flex:1;height:1px;background:rgba(218,167,90,.55)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">Madams of WilBea</div>
    <h1>The Community Pulse</h1>
    <div class="rule"></div>
    <p class="intro" id="intro">Where the Madams decide together. Sign in with the Instagram handle and email you used to join.</p>
  </header>

  <div id="screen">
    <div class="state"><b>One moment…</b>Opening the Pulse.</div>
  </div>

  <footer>
    <a class="btn ghost" href="https://madamsofwilbea.github.io/">Back to the Hub</a>
    <p class="signoff">— The Madams' Circle 👑</p>
  </footer>

</div>

<script>
(function () {
  /* PASTE THE COMMUNITY PULSE WEB APP ADDRESS HERE (the /exec link from its Apps Script deployment) */
  var PULSE_URL = 'https://script.google.com/macros/s/AKfycbzvDXNKrm6wySgAhIP9bxOe6ah2Uuw4N8sJxefqN0SYsty7oFMxG3r8vfBTPhJgoYEo/exec';

  var screen = document.getElementById('screen');
  var intro = document.getElementById('intro');
  var me = { handle: '', email: '' };
  var polls = [], you = null;

  function esc(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function normH(v){ return String(v||'').trim().toLowerCase().replace(/^@/,'').replace(/\s+/g,''); }
  function state(title, body){ screen.innerHTML = '<div class="state"><b>' + title + '</b>' + body + '</div>'; }

  try {
    var saved = JSON.parse(localStorage.getItem('pulseMe') || '{}');
    if (saved.handle && saved.email) me = saved;
  } catch (e) {}

  /* ---------- 1. sign in ---------- */
  function showSignIn(msg) {
    intro.textContent = 'Where the Madams decide together. Sign in with the Instagram handle and email you used to join.';
    screen.innerHTML =
      '<div class="card">' +
        '<label class="f" for="h">Instagram handle</label>' +
        '<input type="text" id="h" placeholder="@yourhandle" autocomplete="username" value="' + esc(me.handle ? '@' + me.handle : '') + '">' +
        '<label class="f" for="e">Email address</label>' +
        '<input type="email" id="e" placeholder="you@email.com" autocomplete="email" value="' + esc(me.email) + '">' +
        '<p class="hint">We use these to check you against our membership list. If we can\u2019t find you, your vote is still saved \u2014 an admin will confirm you and it will count.</p>' +
        (msg ? '<p class="err">' + esc(msg) + '</p>' : '') +
        '<button class="btn" id="go">Enter the Pulse</button>' +
      '</div>';
    document.getElementById('go').onclick = function () {
      var h = normH(document.getElementById('h').value);
      var em = String(document.getElementById('e').value || '').trim().toLowerCase();
      if (!h) return showSignIn('Please enter your Instagram handle.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return showSignIn('Please enter a valid email address.');
      me = { handle: h, email: em };
      try { localStorage.setItem('pulseMe', JSON.stringify(me)); } catch (e) {}
      load();
    };
  }

  function signOut() {
    try { localStorage.removeItem('pulseMe'); } catch (e) {}
    me = { handle: '', email: '' };
    showSignIn('');
  }

  /* ---------- 2. the list ---------- */
  function whoBar() {
    return '<div class="who">Voting as <b>@' + esc(me.handle) + '</b>' +
           '<button type="button" id="out">Not you?</button></div>';
  }

  function showList(flash) {
    intro.textContent = 'Tap a poll to vote. Closed polls show what the community decided.';
    var open = polls.filter(function (p) { return !p.closed; });
    var shut = polls.filter(function (p) { return p.closed; });
    var html = whoBar();

    if (flash) html += '<div class="state" style="border-style:solid;border-color:rgba(46,93,58,.45);margin-bottom:16px"><b>Salamat! 💚</b>' + esc(flash) + '</div>';

    if (you && you.member === false) html += joinBanner();

    if (!polls.length) {
      html += '<div class="state"><b>No polls right now</b>When the Circle needs your voice, it will appear here.</div>';
    }

    if (open.length) {
      html += head('Open for voting');
      open.forEach(function (p, i) { html += row(p, polls.indexOf(p)); });
    }
    if (shut.length) {
      html += head('Closed \u00b7 results');
      shut.forEach(function (p) { html += row(p, polls.indexOf(p)); });
    }

    html += '<div class="suggest-cta"><p class="suggest-b">Got something the FANMILY should decide on?</p>' +
            '<button class="btn ghost" id="sugg" style="margin-top:10px">Suggest a poll</button></div>';

    screen.innerHTML = html;
    document.getElementById('out').onclick = signOut;
    document.getElementById('sugg').onclick = showSuggest;
    Array.prototype.forEach.call(document.querySelectorAll('.poll'), function (el) {
      el.onclick = function () { showPoll(+el.getAttribute('data-i')); };
    });
  }

  function joinBanner() {
    var url = (you && you.joinUrl) || 'https://madamsofwilbea.github.io/madams-app-form/';
    var mismatch = you && /different email/i.test(you.reason || '');
    var title = mismatch ? 'So close, Fam \u2014 but not quite' : 'We can\u2019t find your name, Fam';
    var body = mismatch
      ? 'We found that handle, but it\u2019s filed under a different email. Try the one you joined with \u2014 ' +
        'or if that inbox is long gone (we\u2019ve all had a 2009 email we\u2019d rather forget), just send the form again with this one.'
      : 'Now, before anyone panics: we are absolutely not calling you a stranger. Two things are far more likely. ' +
        'Either you\u2019re new here \u2014 in which case, welcome to the FANMILY, we\u2019re so glad you came \u2014 ' +
        'or you\u2019ve been with us since the very beginning, back when our \u201Cdatabase\u201D was a group chat and a lot of good intentions. ' +
        'If that\u2019s you: hello, OG, and sorry. That one\u2019s on us.';
    return '<div class="join"><div class="join-t">' + title + '</div>' +
           '<p class="join-b">' + body + '</p>' +
           '<p class="join-b" style="margin-top:9px">Either way, your vote is safely saved \u2014 nothing is lost. ' +
           'Take one minute to fill in the form so we can tick you off properly, and an admin will make your vote count. \uD83D\uDC9A</p>' +
           '<a class="btn" href="' + url + '">' + (mismatch ? 'Update my details' : 'Put me on the list') + '</a></div>';
  }

  function head(label) {
    return '<div class="sec"><span class="sec-label">' + esc(label) + '</span><span class="sec-rule"></span></div>';
  }

  function row(p, i) {
    var voted = p.mine && p.mine.answer && p.mine.answer.length;
    return '<button type="button" class="poll' + (p.closed ? ' closed' : '') + '" data-i="' + i + '">' +
      '<div class="tags">' +
        '<span class="tag ' + (p.closed ? 'shut' : 'open') + '">' + (p.closed ? 'Closed' : 'Open') + '</span>' +
        (!p.closed ? '<span class="tag mine">' + (p.multiple ? 'Pick any' : 'Pick one') + '</span>' : '') +
        (voted && !p.closed ? '<span class="tag mine">Your vote is in</span>' : '') +
      '</div>' +
      '<div class="q">' + esc(p.question) + '</div>' +
      '<div class="meta">' + (p.closed
          ? ((p.voters || 0) + (p.voters === 1 ? ' Madam voted' : ' Madams voted'))
          : (p.closes ? 'Closes ' + esc(p.closes) : 'Open until further notice')) +
      '</div></button>';
  }

  /* ---------- 3. one poll ---------- */
  function showPoll(i) {
    var p = polls[i];
    window.scrollTo({ top: 0, behavior: 'smooth' });
    intro.textContent = p.closed ? 'What the community decided.' : 'Choose your answer, then send it.';
    var mine = p.mine || {};
    var chosen = mine.answer || [];

    var html = whoBar() + '<div class="card detail">' +
      '<div class="tags"><span class="tag ' + (p.closed ? 'shut' : 'open') + '">' + (p.closed ? 'Closed' : 'Open') + '</span>' +
      (!p.closed ? '<span class="tag shut">' + (p.multiple ? 'Pick any' : 'Pick one') + '</span>' : '') + '</div>' +
      '<div class="q">' + esc(p.question) + '</div>' +
      (p.details ? '<p class="details">' + esc(p.details) + '</p>' : '');

    if (p.closed) {
      var res = p.results || {}, total = p.voters || 0;
      var best = 0;
      p.options.forEach(function (o) { if ((res[o] || 0) > best) best = res[o] || 0; });
      html += '<div style="margin-top:16px">';
      p.options.forEach(function (o) {
        var n = res[o] || 0;
        var pct = total ? Math.round((n / total) * 100) : 0;
        html += '<div class="bar-row"><div class="bar-top"><b>' + esc(o) + '</b><span>' + pct + '% \u00b7 ' + n + '</span></div>' +
                '<div class="bar"><i class="' + (n === best && n > 0 ? 'top' : '') + '" style="width:' + pct + '%"></i></div></div>';
      });
      html += '</div><p class="hint">' + total + (total === 1 ? ' Madam voted' : ' Madams voted') + ' \u00b7 verified members only.</p>';
    } else {
      if (you && you.member === false) html += joinBanner();
      html += '<div class="opts" id="opts">';
      p.options.forEach(function (o, k) {
        var on = chosen.indexOf(o) > -1;
        html += '<label class="opt' + (on ? ' on' : '') + '">' +
                '<input type="' + (p.multiple ? 'checkbox' : 'radio') + '" name="opt" value="' + esc(o) + '"' + (on ? ' checked' : '') + '>' +
                '<span>' + esc(o) + '</span></label>';
      });
      html += '</div>' +
        '<label class="f" for="note">Anything to add? (optional)</label>' +
        '<textarea id="note" rows="3" placeholder="Your thoughts on this, if you have any.">' + esc(mine.notes || '') + '</textarea>' +
        '<p class="err" id="perr" style="display:none"></p>' +
        '<button class="btn" id="send">' + (chosen.length ? 'Update my vote' : 'Send my vote') + '</button>';
    }

    html += '<button class="btn ghost" id="back">All polls</button></div>';
    screen.innerHTML = html;

    document.getElementById('out').onclick = signOut;
    document.getElementById('back').onclick = function () { showList(''); };

    if (!p.closed) {
      Array.prototype.forEach.call(document.querySelectorAll('.opt input'), function (inp) {
        inp.onchange = function () {
          Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (l) {
            l.classList.toggle('on', l.querySelector('input').checked);
          });
          document.getElementById('perr').style.display = 'none';
        };
      });
      document.getElementById('send').onclick = function () { send(p, i, this); };
    }
  }

  function send(p, i, btn) {
    var picked = [];
    Array.prototype.forEach.call(document.querySelectorAll('.opt input'), function (inp) {
      if (inp.checked) picked.push(inp.value);
    });
    if (!picked.length) {
      var er = document.getElementById('perr');
      er.textContent = 'Please choose an answer first.';
      er.style.display = 'block';
      return;
    }
    var note = document.getElementById('note').value || '';
    var votes = {}, notes = {};
    votes[p.id] = picked; notes[p.id] = note;

    btn.disabled = true; btn.textContent = 'Sending…';
    polls[i].mine = { answer: picked, notes: note };
    post({ handle: me.handle, email: me.email, votes: JSON.stringify(votes), notes: JSON.stringify(notes) }, function () {
      refresh();            // quietly bring the page up to date in the background
    });
    showThanks(p, picked);  // but confirm straight away
  }

  function showThanks(p, picked) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    intro.textContent = 'Your vote is in.';
    var pendingNote = (you && you.member === false)
      ? '<p class="join-b" style="margin-top:10px">One more thing: we still can\u2019t find you on the membership list, so an admin will confirm you before this one is counted. Your answer is safe in the meantime.</p>'
      : '<p class="join-b" style="margin-top:10px">You can change your answer any time until this poll closes.</p>';

    screen.innerHTML = whoBar() +
      '<div class="card" style="text-align:center">' +
        '<div class="tick">\u2713</div>' +
        '<div class="thanks-t">Salamat, Fam! \uD83D\uDC9A</div>' +
        '<p class="join-b">Your vote on <b>\u201C' + esc(p.question) + '\u201D</b> has been recorded:</p>' +
        '<div class="picked">' + picked.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' +
        pendingNote +
        '<button class="btn" id="tback">Back to the polls</button>' +
      '</div>';

    document.getElementById('out').onclick = signOut;
    document.getElementById('tback').onclick = function () { showList(''); };
  }

  // reload the polls without disturbing whatever is on screen
  function refresh() {
    var cb = 'pulseRef' + Date.now();
    window[cb] = function (d) {
      if (d && d.ok) { polls = d.polls || polls; you = d.you || you; }
    };
    var tag = document.createElement('script');
    tag.src = PULSE_URL + (PULSE_URL.indexOf('?') > -1 ? '&' : '?') +
              'view=polls&handle=' + encodeURIComponent(me.handle) +
              '&email=' + encodeURIComponent(me.email) +
              '&callback=' + cb + '&_=' + Date.now();
    document.body.appendChild(tag);
  }

  /* ---------- suggest a poll ---------- */
  function showSuggest() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    intro.textContent = 'Tell us what the FANMILY should decide on. An admin will take a look.';
    screen.innerHTML = whoBar() + '<div class="card">' +
      '<label class="f" for="sq">Your question</label>' +
      '<input type="text" id="sq" placeholder="Where should we hold the Christmas party?">' +
      '<label class="f" for="sd">Anything to explain? (optional)</label>' +
      '<textarea id="sd" rows="2" placeholder="A line of context, if it needs one."></textarea>' +
      '<label class="f" for="so">The choices \u2014 one per line</label>' +
      '<textarea id="so" rows="4" placeholder="Quezon City&#10;Makati&#10;Somewhere in the south"></textarea>' +
      '<label class="f" for="sc">Can people pick more than one?</label>' +
      '<select id="sc"><option value="Single">No \u2014 one answer only</option><option value="Multiple">Yes \u2014 pick any</option></select>' +
      '<label class="f" for="sdl">When should it close? (optional)</label>' +
      '<input type="text" id="sdl" placeholder="Before the October meet-up">' +
      '<p class="hint">The Circle reads every suggestion. If we run it, you\u2019ll get an email. If we don\u2019t, you\u2019ll get an email explaining why \u2014 we won\u2019t leave you guessing.</p>' +
      '<p class="err" id="serr" style="display:none"></p>' +
      '<button class="btn" id="ssend">Send it to the Circle</button>' +
      '<button class="btn ghost" id="sback">Back to the polls</button></div>';

    document.getElementById('out').onclick = signOut;
    document.getElementById('sback').onclick = function () { showList(''); };
    document.getElementById('ssend').onclick = function () {
      var q = document.getElementById('sq').value.trim();
      var opts = document.getElementById('so').value.split('\n').map(function (x) { return x.trim(); }).filter(String);
      var er = document.getElementById('serr');
      if (!q) { er.textContent = 'Please write your question first.'; er.style.display = 'block'; return; }
      if (opts.length < 2) { er.textContent = 'Please give at least two choices, one per line.'; er.style.display = 'block'; return; }
      er.style.display = 'none';
      var btn = this; btn.disabled = true; btn.textContent = 'Sending…';
      post({
        action: 'suggest', handle: me.handle, email: me.email,
        question: q, details: document.getElementById('sd').value,
        options: opts.join('\n'), choice: document.getElementById('sc').value,
        deadline: document.getElementById('sdl').value
      }, function () {
        load('Your suggestion is with the Circle. We\u2019ll email you either way \u2014 promise.');
      });
    };
  }

  /* ---------- talking to the sheet ---------- */
  function post(data, done) {
    var frame = document.getElementById('pulseFrame');
    if (!frame) {
      frame = document.createElement('iframe');
      frame.id = 'pulseFrame'; frame.name = 'pulseFrame';
      frame.style.display = 'none'; frame.src = 'about:blank';
      document.body.appendChild(frame);
    }
    var form = document.createElement('form');
    form.method = 'POST'; form.action = PULSE_URL; form.target = 'pulseFrame';
    Object.keys(data).forEach(function (k) {
      var inp = document.createElement('input');
      inp.type = 'hidden'; inp.name = k; inp.value = data[k] == null ? '' : data[k];
      form.appendChild(inp);
    });
    document.body.appendChild(form);
    var finished = false;
    function finish(){ if (!finished) { finished = true; try { form.remove(); } catch (e) {} done(); } }
    frame.onload = finish;
    setTimeout(finish, 12000);
    form.submit();
  }

  function load(flash) {
    if (!PULSE_URL) { state('Not connected yet', 'The Pulse hasn\u2019t been linked to its sheet.'); return; }
    state('Gathering the polls…', 'One moment.');
    var cb = 'pulseCb' + Date.now(), answered = false, tries = 0;
    window[cb] = function (d) {
      answered = true;
      if (!d || !d.ok) { state('We couldn\u2019t open the Pulse', 'Please refresh and try again.'); return; }
      polls = d.polls || [];
      you = d.you || null;
      showList(flash || '');
    };
    function ask() {
      tries++;
      var tag = document.createElement('script');
      tag.src = PULSE_URL + (PULSE_URL.indexOf('?') > -1 ? '&' : '?') +
                'view=polls&handle=' + encodeURIComponent(me.handle) +
                '&email=' + encodeURIComponent(me.email) +
                '&callback=' + cb + '&_=' + Date.now();
      tag.onerror = function () {
        if (answered) return;
        if (tries < 3) { setTimeout(ask, tries * 1200); return; }
        state('We couldn\u2019t open the Pulse', 'Please refresh, or try again in a few minutes.');
      };
      document.body.appendChild(tag);
    }
    ask();
    setTimeout(function () { if (!answered) state('This is taking a while', 'Please refresh and try again.'); }, 15000);
  }

  if (me.handle && me.email) load(''); else showSignIn('');
})();
</script>

</body>
